  <text x="379.0" y="946" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5E5E">label</text>
  <rect x="594.0" y="890" width="217.0" height="80" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="608.0" y="924" font-size="18" font-weight="700" text-anchor="start" fill="#262626">figure</text>
  <text x="608.0" y="946" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5E5E">label</text>
  <rect x="823.0" y="890" width="217.0" height="80" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="837.0" y="924" font-size="18" font-weight="700" text-anchor="start" fill="#262626">figure</text>
  <text x="837.0" y="946" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5E5E">label</text>
  <line x1="96" y1="978" x2="1460" y2="978" stroke="#6A6A6A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="132" y="968" width="97" height="20" rx="10" fill="#FFFFFF" stroke="#6A6A6A"/>
  <text x="180.7" y="982" font-size="11" font-weight="400" text-anchor="middle" fill="#5E5E5E">fold at 900 px</text>
  <rect x="120" y="1002" width="936" height="120" rx="8" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="132" y="1022" font-size="13" font-weight="650" text-anchor="start" fill="#262626">More panels by kind and by tab</text>
  <text x="132" y="1040.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Reads: lawful reads only — a read without a lawful basis reads "Withheld: no lawful basis".</text>
  <text x="132" y="1056.7" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Pursuit: ranked choke junctions and "Request a unit". Timeline: the full activity list.</text>
  <text x="132" y="1073.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Nearby: linked records ("Open in graph" goes to Analyst). Record: every field the Analyst inspector shows.</text>
  <text x="132" y="1090.1" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Event pages carry the lifecycle actions (cancel keeps its inline confirm).</text>
  <!-- side column -->
  <rect x="1076" y="570" width="360" height="40" rx="10" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="1088" y="595" font-size="11" font-weight="400" text-anchor="start" fill="#5E5E5E">"Ask about it" panel (read-only), when opened</text>
  <rect x="1076" y="622" width="360" height="214" rx="8" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="1088" y="642" font-size="13" font-weight="650" text-anchor="start" fill="#262626">Decision waiting (CTA)</text>
  <text x="1088" y="660.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">time left (role="timer") · kind</text>
  <text x="1088" y="676.7" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">title + plate chip · one line</text>
  <text x="1088" y="693.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">a SECONDARY "Review and decide →": the</text>
  <text x="1088" y="710.1" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">decision's one home is Decide; no approve</text>
  <text x="1088" y="726.8" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">control lives on an object page</text>
  <rect x="1092" y="782" width="328" height="40" rx="20" fill="#FFFFFF" stroke="#8E8E8E" stroke-width="1.2"/>
  <text x="1256.0" y="806.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#262626">Review and decide →</text>
  <rect x="1076" y="850" width="360" height="236" rx="8" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="1088" y="870" font-size="13" font-weight="650" text-anchor="start" fill="#262626">Key facts</text>
  <text x="1088" y="888.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">registration mark · class · basis · reported (demo FIR)</text>
  <text x="1088" y="904.7" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">retention · camera · time — each a link where it names a record</text>
  <rect x="1092" y="918" width="320" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1092" y="940" width="320" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1092" y="962" width="320" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1092" y="984" width="320" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1092" y="1006" width="320" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1092" y="1028" width="198" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1076" y="1098" width="360" height="96" rx="8" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="1088" y="1118" font-size="13" font-weight="650" text-anchor="start" fill="#262626">Recent activity (5)</text>
  <rect x="1092" y="1138" width="320" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="1092" y="1158" width="198" height="5" rx="2.5" fill="#DCDCDC"/>
  <text x="1076" y="1222" font-size="11" font-weight="400" text-anchor="start" fill="#5E5E5E">Rule note of the kind (e.g. vehicles only; places, never persons).</text>
  <!-- legend -->
  <rect x="20" y="1273" width="14" height="14" rx="3" fill="#E8E8E8" stroke="#A2A2A2"/>
  <text x="42" y="1284" font-size="12" fill="#5E5E5E">layout region</text>
  <rect x="140" y="1273" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#8A8A8A" stroke-dasharray="4 3"/>
  <text x="162" y="1284" font-size="12" fill="#5E5E5E">shown only when needed, or closed by default</text>
  <rect x="450" y="1273" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#9A9A9A"/>
  <text x="472" y="1284" font-size="12" fill="#5E5E5E">map or picture</text>
  <rect x="590" y="1273" width="14" height="14" rx="7" fill="#276EF1"/>
  <text x="612" y="1284" font-size="12" fill="#5E5E5E">the one primary action of the screen (the only colour used)</text>
  <text x="20" y="1306" font-size="12" fill="#5E5E5E">Ten record kinds share this layout (event, OSINT report, vehicle, place, operation, junction, camera, dispatch, recommendation, sighting) plus a generic one. A link that fails the URN grammar reads "Not a record" and fetches nothing.</text>
</svg>
