  <circle cx="1412" cy="434" r="22" fill="#E8E8E8" stroke="#A2A2A2"/>
  <text x="1412" y="438" font-size="12" font-weight="400" text-anchor="middle" fill="#262626">…</text>
  <!-- tabs -->
  <text x="134" y="528" font-size="14" font-weight="700" text-anchor="start" fill="#262626">Overview</text>
  <line x1="120" y1="544" x2="216" y2="544" stroke="#4A4A4A" stroke-width="1.2"/>
  <text x="254" y="528" font-size="14" font-weight="500" text-anchor="start" fill="#262626">Reads 20</text>
  <text x="374" y="528" font-size="14" font-weight="500" text-anchor="start" fill="#262626">Timeline 60</text>
  <text x="494" y="528" font-size="14" font-weight="500" text-anchor="start" fill="#262626">Nearby 64</text>
  <text x="614" y="528" font-size="14" font-weight="500" text-anchor="start" fill="#262626">Record 10</text>
  <text x="740" y="528" font-size="11" font-weight="400" text-anchor="start" fill="#5E5E5E">tabs per kind: Overview · Sources (reports) · Reads (vehicles) · Pursuit (when open) · Timeline · Nearby · Record</text>
  <line x1="120" y1="548" x2="1056" y2="548" stroke="#C8C8C8" stroke-width="1.2"/>
  <!-- two columns: main 1fr | side 360 px (420 px at &gt;= 1500 px) -->
  <rect x="120" y="570" width="936" height="270" rx="8" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="132" y="590" font-size="13" font-weight="650" text-anchor="start" fill="#262626">Overview, per kind — e.g. "The vehicle"</text>
  <text x="132" y="608.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">vehicle shot · registration mark (masked until a duty officer is named; "every view is recorded") · kind · lawful basis · retention · last lawful read</text>
  <text x="132" y="624.7" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Reported event: "What is reported" (redaction chips), "How sure are we" (credibility gauge, four plain checks, verification ladder),</text>
  <text x="132" y="641.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">"What it may affect" (estimates labelled simulated). Place: the place section and its reports. Operation: progress and next junction.</text>
  <rect x="136" y="668" width="200" height="130" rx="12" fill="#DCDCDC" stroke="#989898" stroke-width="1.2"/>
  <text x="236" y="738" font-size="11" font-weight="400" text-anchor="middle" fill="#5E5E5E">vehicle shot</text>
  <rect x="356" y="678" width="360" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="356" y="700" width="360" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="356" y="722" width="360" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="356" y="744" width="223" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="136" y="808" width="904" height="22" rx="6" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="148" y="824" font-size="10.5" font-weight="400" text-anchor="start" fill="#262626">Rule strip: "Evidence only. No e-challan for a stolen vehicle's owner; a sighting can only authorise one pursuit."</text>
  <rect x="120" y="856" width="936" height="130" rx="8" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="132" y="876" font-size="13" font-weight="650" text-anchor="start" fill="#262626">At a glance — figures</text>
