<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1322" width="1480" height="1322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Veer V3 — Object page (/o/&lt;urn&gt;) — low-fidelity wireframe">
