<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1042" width="1480" height="1042" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Veer V3 — Plan a movement (/plan) — low-fidelity wireframe">
  <title>Veer V3 — Plan a movement (/plan) — low-fidelity wireframe</title>
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#EFEFEF"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#E0E0E0" stroke-width="5"/>
    </pattern>
  </defs>
  <rect width="1480" height="1042" fill="#FFFFFF"/>
  <text x="20" y="32" font-size="21" font-weight="700" fill="#262626">Veer V3 — Plan a movement (/plan)</text>
  <text x="20" y="56" font-size="13" fill="#5E5E5E">Low-fidelity wireframe of the shipped V3 layout at 1440 px wide (the 1366-class sizes apply below 1500 px: rail 76, top bar 60, gutter 24).</text>
  <!-- frame -->
  <rect x="20" y="78" width="1440" height="900" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.5"/>
  <!-- AppRail: 88 px at &gt;= 1500 px wide, 76 px below; icon + label, never icon-only -->
  <rect x="20" y="78" width="76" height="900" rx="0" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <rect x="36" y="90" width="44" height="44" rx="10" fill="#DCDCDC" stroke="#989898" stroke-width="1.2"/>
  <text x="58" y="117" font-size="15" font-weight="700" text-anchor="middle" fill="#5E5E5E">V</text>
  <rect x="28" y="148" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <circle cx="58.0" cy="168" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="194" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Home</text>
  <rect x="28" y="212" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <circle cx="58.0" cy="232" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="258" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Map</text>
  <rect x="28" y="276" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <circle cx="58.0" cy="296" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="322" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Decide</text>
  <circle cx="72.0" cy="287" r="7" fill="#FFFFFF" stroke="#4A4A4A"/>
  <text x="72.0" y="291" font-size="9" font-weight="700" text-anchor="middle" fill="#262626">n</text>
  <rect x="28" y="340" width="60" height="56" rx="10" fill="#DCDCDC" stroke="#989898" stroke-width="1.6"/>
  <circle cx="58.0" cy="360" r="8" fill="#CFCFCF" stroke="#8E8E8E"/>
  <text x="58.0" y="386" font-size="10.5" font-weight="700" text-anchor="middle" fill="#262626">Plan</text>
  <rect x="28" y="404" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <circle cx="58.0" cy="424" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="450" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Assistant</text>
  <rect x="28" y="468" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <circle cx="58.0" cy="488" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="514" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Advisories</text>
  <line x1="34" y1="894" x2="82" y2="894" stroke="#B5B5B5" stroke-width="1.2"/>
  <rect x="28" y="906" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <circle cx="58.0" cy="926" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="952" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Analyst</text>
  <!-- TopBar: 68 px at &gt;= 1500 px, 60 px below; title | search (centred, the prominent element) | menu, bell, officer -->
  <rect x="96" y="78" width="1364" height="60" rx="0" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="120" y="115" font-size="16" font-weight="700" text-anchor="start" fill="#262626">Plan a movement</text>
  <rect x="438" y="88" width="680" height="40" rx="20" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/>
  <circle cx="460" cy="108" r="7" fill="#DCDCDC" stroke="#989898"/>
  <text x="478" y="113" font-size="12.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Search a place, road, event or vehicle mark</text>
  <rect x="1058" y="97" width="48" height="22" rx="11" fill="#FFFFFF" stroke="#9A9A9A"/>
  <text x="1082.0" y="111.6" font-size="10" font-weight="600" text-anchor="middle" fill="#5E5E5E">Ctrl K</text>
  <rect x="1136" y="92" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#9A9A9A"/>
  <text x="1184.0" y="111.96000000000001" font-size="11" font-weight="600" text-anchor="middle" fill="#5E5E5E">Menu · EN</text>
  <circle cx="1260" cy="108" r="12" fill="#E8E8E8" stroke="#A2A2A2"/>
  <rect x="1286" y="88" width="150" height="40" rx="20" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <circle cx="1308" cy="108" r="11" fill="#DCDCDC" stroke="#989898"/>
  <text x="1326" y="105" font-size="11.5" font-weight="650" text-anchor="start" fill="#262626">Duty officer</text>
  <text x="1326" y="119" font-size="10" font-weight="400" text-anchor="start" fill="#5E5E5E">pill · plates hidden</text>
  <!-- the sheet: 460 px below 1500 px (540 px above) -->
  <rect x="114" y="156" width="460" height="804" rx="18" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <circle cx="147" cy="186" r="11" fill="#DCDCDC" stroke="#7A7A7A"/>
  <text x="147" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#262626">1</text>
  <text x="164" y="190" font-size="12" font-weight="650" text-anchor="start" fill="#262626">Where to</text>
  <circle cx="255" cy="186" r="11" fill="#FFFFFF" stroke="#7A7A7A"/>
  <text x="255" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#262626">2</text>
  <text x="272" y="190" font-size="12" font-weight="500" text-anchor="start" fill="#262626">Routes</text>
  <circle cx="363" cy="186" r="11" fill="#FFFFFF" stroke="#7A7A7A"/>
  <text x="363" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#262626">3</text>
  <text x="380" y="190" font-size="12" font-weight="500" text-anchor="start" fill="#262626">Launch</text>
  <circle cx="471" cy="186" r="11" fill="#FFFFFF" stroke="#7A7A7A"/>
  <text x="471" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#262626">4</text>
  <text x="488" y="190" font-size="12" font-weight="500" text-anchor="start" fill="#262626">Live</text>
  <line x1="114" y1="212" x2="574" y2="212" stroke="#C8C8C8" stroke-width="1.2"/>
  <text x="136" y="248" font-size="24" font-weight="700" text-anchor="start" fill="#262626">Where to?</text>
  <text x="136" y="270" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Pick the start, the destination and the class. Veer proposes routes;</text>
  <text x="136" y="286" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">a named officer starts the escort.</text>
  <rect x="136" y="302" width="370" height="56" rx="12" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="154" y="326" font-size="11" font-weight="400" text-anchor="start" fill="#5E5E5E">From — place search</text>
  <rect x="154" y="338" width="99" height="5" rx="2.5" fill="#DCDCDC"/>
  <rect x="136" y="366" width="370" height="56" rx="12" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="154" y="390" font-size="11" font-weight="400" text-anchor="start" fill="#5E5E5E">To — place search</text>
  <rect x="154" y="402" width="99" height="5" rx="2.5" fill="#DCDCDC"/>
  <circle cx="534" cy="362" r="18" fill="#E8E8E8" stroke="#A2A2A2"/>
  <text x="534" y="366" font-size="12" font-weight="400" text-anchor="middle" fill="#262626">⇅</text>
  <rect x="136" y="438" width="416" height="130" rx="12" fill="url(#hatch)" stroke="#9A9A9A" stroke-width="1.2"/>
  <text x="152" y="460" font-size="12" font-weight="650" text-anchor="start" fill="#262626">Place picture (Cover) of the chosen place</text>
  <text x="152" y="556" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5E5E">"Reference photo · not live" + credit and licence</text>
  <text x="136" y="594" font-size="13" font-weight="650" text-anchor="start" fill="#262626">Protection class</text>
  <rect x="136.0" y="604" width="96.5" height="144" rx="12" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <rect x="144.0" y="612" width="80.5" height="46" rx="8" fill="#DCDCDC" stroke="#989898" stroke-width="1.2"/>
  <text x="184.25" y="640" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5E5E5E">convoy shot</text>
  <text x="146.0" y="684" font-size="17" font-weight="700" text-anchor="start" fill="#262626">Z+</text>
  <text x="146.0" y="706" font-size="10" font-weight="400" text-anchor="start" fill="#5E5E5E">6-lane floor</text>
  <text x="146.0" y="722" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">roads close 3 min</text>
  <text x="146.0" y="736" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">ahead</text>
  <rect x="242.5" y="604" width="96.5" height="144" rx="12" fill="#DCDCDC" stroke="#989898" stroke-width="1.8"/>
  <rect x="250.5" y="612" width="80.5" height="46" rx="8" fill="#DCDCDC" stroke="#989898" stroke-width="1.2"/>
  <text x="290.75" y="640" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5E5E5E">convoy shot</text>
  <text x="252.5" y="684" font-size="17" font-weight="700" text-anchor="start" fill="#262626">Z</text>
  <text x="252.5" y="706" font-size="10" font-weight="400" text-anchor="start" fill="#5E5E5E">4-lane floor</text>
  <text x="252.5" y="722" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">roads close 2 min</text>
  <text x="252.5" y="736" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">ahead</text>
  <rect x="349.0" y="604" width="96.5" height="144" rx="12" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <rect x="357.0" y="612" width="80.5" height="46" rx="8" fill="#DCDCDC" stroke="#989898" stroke-width="1.2"/>
  <text x="397.25" y="640" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5E5E5E">convoy shot</text>
  <text x="359.0" y="684" font-size="17" font-weight="700" text-anchor="start" fill="#262626">Y</text>
  <text x="359.0" y="706" font-size="10" font-weight="400" text-anchor="start" fill="#5E5E5E">2-lane floor</text>
  <text x="359.0" y="722" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">roads close 1 min</text>
  <text x="359.0" y="736" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">ahead</text>
  <rect x="455.5" y="604" width="96.5" height="144" rx="12" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <rect x="463.5" y="612" width="80.5" height="46" rx="8" fill="#DCDCDC" stroke="#989898" stroke-width="1.2"/>
  <text x="503.75" y="640" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5E5E5E">convoy shot</text>
  <text x="465.5" y="684" font-size="17" font-weight="700" text-anchor="start" fill="#262626">X</text>
  <text x="465.5" y="706" font-size="10" font-weight="400" text-anchor="start" fill="#5E5E5E">1-lane floor</text>
  <text x="465.5" y="722" font-size="9.5" font-weight="400" text-anchor="start" fill="#5E5E5E">no advance closure</text>
  <text x="136" y="766" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5E5E">From the protocol table the planner applies.</text>
  <text x="136" y="792" font-size="12" font-weight="650" text-anchor="start" fill="#262626">Departure</text>
  <rect x="214" y="776" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#9A9A9A"/>
  <text x="259.0" y="792.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5E5E5E">In 30 min</text>
  <rect x="314" y="776" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#9A9A9A"/>
  <text x="359.0" y="792.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5E5E5E">In 1 hour</text>
  <rect x="414" y="776" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#9A9A9A"/>
  <text x="459.0" y="792.78" font-size="10.5" font-weight="600" text-anchor="middle" fill="#5E5E5E">At a time</text>
  <rect x="136" y="812" width="416" height="30" rx="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="148" y="832" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5E5E">Optional test / rehearsal label — never shown as a real movement</text>
  <line x1="114" y1="856" x2="574" y2="856" stroke="#C8C8C8" stroke-width="1.2"/>
  <rect x="136" y="868" width="416" height="52" rx="26" fill="#276EF1" stroke="#276EF1"/>
  <text x="344.0" y="899.4" font-size="15" font-weight="650" text-anchor="middle" fill="#FFFFFF">Find routes</text>
  <text x="344.0" y="940" font-size="10" font-weight="400" text-anchor="middle" fill="#5E5E5E">Finding routes registers the movement. Nothing moves until a named officer starts the escort.</text>
  <!-- the satellite map beside the sheet -->
  <rect x="592" y="156" width="844" height="804" rx="18" fill="url(#hatch)" stroke="#9A9A9A" stroke-width="1.2"/>
  <text x="1014.0" y="408" font-size="13" font-weight="600" text-anchor="middle" fill="#7A7A7A">satellite map: the From and To pins; the candidate routes after "Find routes"</text>
  <circle cx="812" cy="638" r="14" fill="#FFFFFF" stroke="#4A4A4A"/>
  <text x="836" y="643" font-size="12" font-weight="650" text-anchor="start" fill="#262626">From</text>
  <circle cx="1272" cy="278" r="14" fill="#FFFFFF" stroke="#4A4A4A"/>
  <text x="1296" y="283" font-size="12" font-weight="650" text-anchor="start" fill="#262626">To</text>
  <rect x="612" y="790" width="804" height="150" rx="8" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="624" y="810" font-size="13" font-weight="650" text-anchor="start" fill="#262626">Steps 2 – 4 replace the sheet's body</text>
  <text x="624" y="828.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">2  Routes — route cards best first: time, distance, roads held, lane floor met or the number of violations, and the state</text>
  <text x="624" y="844.7" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">    (Ready to launch · Needs a waiver · Held by the decider · No route); the recommended route marked; times labelled "Simulated traffic".</text>
  <text x="624" y="861.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">3  Launch — a conditional plan needs the listed lane-floor waiver accepted; "Who is launching?"; Start escort ("One press sends one request");</text>
  <text x="624" y="878.1" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">    a refused or failed launch is shown in the planner's own words and never retried on its own.</text>
  <text x="624" y="894.8" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">4  Live — "Escort running", the emulated convoy position (labelled), "A decision waits on this escort → Review in Decide",</text>
  <text x="624" y="911.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#5E5E5E">    Follow on the map, Stop escort, Clear the movement (lifts the closures, restores the signal programs, closes the event).</text>
  <!-- legend -->
  <rect x="20" y="993" width="14" height="14" rx="3" fill="#E8E8E8" stroke="#A2A2A2"/>
  <text x="42" y="1004" font-size="12" fill="#5E5E5E">layout region</text>
  <rect x="140" y="993" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#8A8A8A" stroke-dasharray="4 3"/>
  <text x="162" y="1004" font-size="12" fill="#5E5E5E">shown only when needed, or closed by default</text>
  <rect x="450" y="993" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#9A9A9A"/>
  <text x="472" y="1004" font-size="12" fill="#5E5E5E">map or picture</text>
  <rect x="590" y="993" width="14" height="14" rx="7" fill="#276EF1"/>
  <text x="612" y="1004" font-size="12" fill="#5E5E5E">the one primary action of the screen (the only colour used)</text>
  <text x="20" y="1026" font-size="12" fill="#5E5E5E">The planner has its own page (a design-review decision). Every protection-class value is read from the protocol table the planner applies (shared/schemas/protocol_params.json).</text>
</svg>
