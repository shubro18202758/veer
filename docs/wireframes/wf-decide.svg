<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1042" width="1480" height="1042" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Veer V3 — Decide (/decide, /decide/&lt;unit&gt;) — low-fidelity wireframe">
