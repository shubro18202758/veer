  <text x="58.0" y="322" font-size="10.5" font-weight="700" text-anchor="middle" fill="#262626">Decide</text>
  <circle cx="72.0" cy="287" r="7" fill="#FFFFFF" stroke="#4A4A4A"/>
  <text x="72.0" y="291" font-size="9" font-weight="700" text-anchor="middle" fill="#262626">n</text>
  <rect x="28" y="340" width="60" height="56" rx="10" fill="#E8E8E8" stroke="#A2A2A2" stroke-width="1.0"/>
  <circle cx="58.0" cy="360" r="8" fill="#DCDCDC" stroke="#989898"/>
  <text x="58.0" y="386" font-size="10.5" font-weight="500" text-anchor="middle" fill="#262626">Plan</text>
